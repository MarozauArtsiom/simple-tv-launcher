name: Android

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Build, unit tests and screenshot verification
        run: ./gradlew assembleDebug testDebugUnitTest verifyRoborazziDebug --stacktrace

      - name: Release build (R8) and its size
        run: |
          ./gradlew assembleRelease --stacktrace
          ls -l app/build/outputs/apk/release/*.apk

      - uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: screenshot-diffs
          path: |
            app/src/test/snapshots/**
            app/build/outputs/roborazzi/**
            app/build/reports/tests/**
