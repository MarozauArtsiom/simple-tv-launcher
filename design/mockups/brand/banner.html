<!doctype html>
<html lang="en">
<head>

  <title>Launcher banner</title>
  <link rel="stylesheet" href="../tokens.css">
  <style>
    html, body { width: 320px; height: 180px; }
    body { background: radial-gradient(260px 160px at 15% 0%, #2A3350 0%, #0B0D12 75%);
           display: grid; place-items: center; font-family: Roboto, system-ui, sans-serif; }

    .mark svg { width: 34px; height: 34px; fill: #0B0D12; }
    .name { font-size: 34px; font-weight: 600; color: #E8EAF0; letter-spacing: -.01em; }
  </style>
</head>

  <div class="logo">

    <span class="name">Simple TV</span>
  </div>
</body>
</html>
