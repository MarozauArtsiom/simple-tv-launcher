<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>Screensaver</title>
  <link rel="stylesheet" href="tokens.css">
  <style>
    body { background: url(assets/landscape-placeholder.svg) center / cover; }
    body::before { /* short bottom gradient only, so the photo stays untouched */
      content: ''; position: fixed; left: 0; right: 0; bottom: 0; height: 120px;
      background: linear-gradient(to top, rgba(0, 0, 0, .55), transparent);
    }
    .credit, .time { position: fixed; bottom: var(--safe-v); }
    .credit { left: var(--safe-h); }
    .credit .meta { color: var(--on-surface-variant); }
    .time { right: var(--safe-h); }
  </style>
</head>
<body>
  <div class="credit">
    <div class="title-medium">Название места</div>
    <div class="label-medium meta">Фото: автор · CC BY-SA 4.0 · Wikimedia Commons</div>
  </div>
  <div class="time headline-small">20:41</div>
</body>
</html>
