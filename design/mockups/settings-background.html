<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>Background picker</title>
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="themes.css">
  <link rel="stylesheet" href="settings.css">
  <script src="panel.js"></script>
  <style></style>
</head>
<body>
  <script src="icons.js"></script>
  <iframe class="behind" data-src="home.html?nofocus" title="home"></iframe>

  <div class="dim" style="--dim: .15"></div>
  <aside class="sheet wide">
    <h1>Фон</h1>
    <div class="item"><svg><use href="#image"/></svg><span class="title title-medium">Из темы</span><span class="value body-medium">Полночь</span><svg class=check><use href="#check"/></svg></div>
    <div class="section label-large">Цвет</div>
    <div class="swatches"><span class="swatch" style="background:#0B0D12"></span>
<span class="swatch" style="background:#1B2A44"></span>
<span class="swatch" style="background:#3B2A6B"></span>
<span class="swatch" style="background:#24523A"></span>
<span class="swatch" style="background:#7A2E2E"></span>
<span class="swatch" style="background:#5C4A1F"></span></div>
    <div class="section label-large">Картинки с флешки · 6</div>
    <div class="grid3"><div class="pic" style="background-image:url(assets/bg/aurora.svg)"></div>
<div class="pic focused" style="background-image:url(assets/bg/sky.svg)"></div>
<div class="pic" style="background-image:url(assets/bg/sage.svg)"></div>
<div class="pic" style="background-image:url(assets/bg/valley.svg)"></div>
<div class="pic" style="background-image:url(assets/bg/ocean.svg)"></div>
<div class="pic" style="background-image:url(assets/bg/space.svg)"></div></div>
  </aside>
  <script></script>
</body>
</html>
