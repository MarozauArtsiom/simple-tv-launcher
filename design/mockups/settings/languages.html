<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>Languages sheet</title>
  <link rel="stylesheet" href="../tokens.css">
  <style>
    body { background: #101216; padding: 12px 16px; display: grid; gap: 12px 16px;
           grid-template-columns: repeat(2, 456px); grid-template-rows: repeat(3, 164px); justify-content: center; }
    .cell { position: relative; overflow: hidden; border-radius: 10px; }
    .cell iframe { width: 960px; height: 540px; border: 0; transform: scale(.52); transform-origin: 0 0; }
    .cell span { position: absolute; right: 8px; top: 8px; padding: 2px 12px; border-radius: 12px;
                 background: rgba(10, 12, 16, .85); color: #FFFFFF; }
  </style>
</head>
<body>
  <script>
    const LANGS = [['be', 'Беларуская'], ['ru', 'Русский'], ['en', 'English'], ['pl', 'Polski'], ['de', 'Deutsch'], ['fr', 'Français']];
    for (const [code, name] of LANGS) {
      document.write(`<div class="cell"><iframe src="../home.html?nofocus&lang=${code}" title="${code}"></iframe><span class="label-large">${name}</span></div>`);
    }
  </script>
</body>
</html>
