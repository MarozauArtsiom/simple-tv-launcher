<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>Language picker</title>
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="themes.css">
  <link rel="stylesheet" href="settings.css">
  <script src="panel.js"></script>
</head>
<body>
  <script src="icons.js"></script>
  <iframe class="behind" title="home"></iframe>
  <div class="dim"></div>

  <aside class="sheet">
    <h1>Язык</h1>
    <div class="list">
      <div class="item focused"><span class="title title-medium">Беларуская мова</span></div>
      <div class="item"><span class="title title-medium">Русский</span><svg class="check"><use href="#check"/></svg></div>
      <div class="item"><span class="title title-medium">English</span></div>
      <div class="item"><span class="title title-medium">Polski</span></div>
      <div class="item"><span class="title title-medium">Deutsch</span></div>
      <div class="item"><span class="title title-medium">Français</span></div>
      <div class="item"><span class="title title-medium">Как на телевизоре</span><span class="value body-medium">Русский</span></div>
    </div>
  </aside>
</body>
</html>
