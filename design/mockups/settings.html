<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>Settings</title>
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="themes.css">
  <link rel="stylesheet" href="settings.css">
  <script src="panel.js"></script>
</head>
<body>
  <script src="icons.js"></script>
  <iframe class="behind" title="home"></iframe>
  <div class="dim"></div>

  <aside class="sheet fade">
    <h1>Настройки</h1>

    <div class="section label-large">Телевизор</div>
    <div class="tiles label-large">
      <div class="tile"><svg><use href="#wifi"/></svg>Wi-Fi</div>
      <div class="tile"><svg><use href="#bluetooth"/></svg>Bluetooth</div>
      <div class="tile"><svg><use href="#sound"/></svg>Звук</div>
      <div class="tile"><svg><use href="#picture"/></svg>Картинка</div>
      <div class="tile"><svg><use href="#sleep"/></svg>Таймер сна</div>
      <div class="tile"><svg><use href="#gear"/></svg>Android</div>
    </div>

    <div class="section label-large">Лаунчер</div>
    <div class="list">
      <div class="item focused"><svg><use href="#palette"/></svg><span class="title title-medium">Тема</span><span class="value body-medium" data-theme-name></span><svg class="chevron"><use href="#chevron"/></svg></div>
      <div class="item"><svg><use href="#image"/></svg><span class="title title-medium">Фон</span><span class="value body-medium">Из темы</span><svg class="chevron"><use href="#chevron"/></svg></div>
      <div class="item"><svg><use href="#language"/></svg><span class="title title-medium">Язык</span><span class="value body-medium">Русский</span><svg class="chevron"><use href="#chevron"/></svg></div>
      <div class="item"><svg><use href="#cloud"/></svg><span class="title title-medium">Погода</span><span class="value body-medium">Минск</span><svg class="chevron"><use href="#chevron"/></svg></div>
      <div class="item"><svg><use href="#input"/></svg><span class="title title-medium">Сигнал на HDMI</span><span class="value body-medium">Вкл</span><svg class="chevron"><use href="#chevron"/></svg></div>
      <div class="item"><svg><use href="#hidden"/></svg><span class="title title-medium">Скрытые приложения</span><span class="value body-medium">2</span><svg class="chevron"><use href="#chevron"/></svg></div>
      <div class="item"><svg><use href="#usb"/></svg><span class="title title-medium">Установить с флешки</span><svg class="chevron"><use href="#chevron"/></svg></div>
      <div class="item"><svg><use href="#info"/></svg><span class="title title-medium">О лаунчере</span><svg class="chevron"><use href="#chevron"/></svg></div>
    </div>
  </aside>
</body>
</html>
