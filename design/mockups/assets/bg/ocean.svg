      <circle cx="-12" cy="-3" r="5" fill="#FFFFFF"/><circle cx="-13" cy="-3" r="2.5" fill="#23324A"/>
    </g>
    <g id="bubble"><circle r="8" fill="none" stroke="#FFFFFF" stroke-width="2.5" opacity=".85"/><circle cx="-3" cy="-3" r="2" fill="#FFFFFF"/></g>
  </defs>
  <rect width="960" height="540" fill="url(#sea)"/>
  <g fill="#FFFFFF" opacity=".10">
