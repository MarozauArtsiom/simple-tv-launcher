      <path d="M-8 -19 Q-2 0 -8 19" stroke="#FFFFFF" stroke-width="8" fill="none"/>
      <path d="M12 -16 Q17 0 12 16" stroke="#FFFFFF" stroke-width="7" fill="none"/>
