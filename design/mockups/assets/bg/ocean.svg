      <stop offset="0" stop-color="#6ADCF8"/><stop offset=".5" stop-color="#22A3DD"/><stop offset="1" stop-color="#0D6FB0"/>
    </linearGradient>
    <g id="clown">
      <path d="M26 0 L46 -16 L42 0 L46 16 Z" fill="#FF7A1A" stroke="#23324A" stroke-width="3" stroke-linejoin="round"/>
