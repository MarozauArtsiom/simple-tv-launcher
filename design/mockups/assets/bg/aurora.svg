<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" preserveAspectRatio="xMidYMid slice">
  <!-- Aurora: soft colour fields on deep navy. Rendered once into a bitmap in the app. -->
  <defs>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="60"/></filter>
  </defs>
  <rect width="960" height="540" fill="#090D1C"/>
  <g filter="url(#blur)">
    <ellipse cx="230" cy="110" rx="330" ry="110" fill="#4B33D6" opacity=".60" transform="rotate(-14 230 110)"/>
    <ellipse cx="690" cy="70" rx="300" ry="95" fill="#0FB3A5" opacity=".50" transform="rotate(8 690 70)"/>
    <ellipse cx="840" cy="430" rx="290" ry="140" fill="#B8358F" opacity=".38"/>
    <ellipse cx="120" cy="470" rx="220" ry="110" fill="#1F5BD6" opacity=".30"/>
  </g>
  <g fill="#FFFFFF">
    <circle cx="512" cy="40" r="1.4" opacity=".7"/><circle cx="604" cy="118" r="1.2" opacity=".5"/>
    <circle cx="880" cy="160" r="1.5" opacity=".6"/><circle cx="380" cy="150" r="1.1" opacity=".5"/>
    <circle cx="760" cy="260" r="1.2" opacity=".4"/><circle cx="60" cy="250" r="1.3" opacity=".5"/>
  </g>
</svg>
