  <path d="M0 290 Q120 220 270 270 T560 255 T820 240 T960 265 V540 H0 Z" fill="#A6E57E"/>
  <path d="M0 350 Q170 280 340 330 T690 320 T960 300 V540 H0 Z" fill="#72CF4F"/>
  <path d="M0 430 Q210 365 430 415 T830 400 T960 395 V540 H0 Z" fill="#4DB73C"/>
  <path d="M600 540 Q640 470 560 430 T600 330" stroke="#F6DFA9" stroke-width="28" fill="none" stroke-linecap="round"/>

  <g transform="translate(905 255)">
    <rect x="-6" y="-46" width="12" height="22" fill="#B5523B"/>
    <rect x="-38" y="-10" width="76" height="56" rx="4" fill="#FFF2D9"/>
    <path d="M-48 -8 L0 -52 L48 -8 Z" fill="#FF5A5F" stroke="#D93F45" stroke-width="4" stroke-linejoin="round"/>
