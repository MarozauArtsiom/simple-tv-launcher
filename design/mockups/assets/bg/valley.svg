      <line x1="-41" y1="-41" x2="-54" y2="-54"/><line x1="41" y1="41" x2="54" y2="54"/>
      <line x1="41" y1="-41" x2="54" y2="-54"/><line x1="-41" y1="41" x2="-54" y2="54"/>
    </g>
    <circle r="46" fill="#FFD23F" stroke="#FFB020" stroke-width="5"/>
    <circle cx="-15" cy="-7" r="5" fill="#5A3B00"/><circle cx="15" cy="-7" r="5" fill="#5A3B00"/>
    <path d="M-17 11 Q0 27 17 11" stroke="#5A3B00" stroke-width="5" fill="none" stroke-linecap="round"/>
    <circle cx="-27" cy="8" r="7" fill="#FF8FA3" opacity=".75"/><circle cx="27" cy="8" r="7" fill="#FF8FA3" opacity=".75"/>
