  <use href="#cloud" transform="translate(300 108) scale(.8)"/>
  <use href="#cloud" transform="translate(820 112) scale(.7)"/>
  <use href="#cloud" transform="translate(70 230) scale(.9)"/>
  <g stroke="#23324A" stroke-width="3" fill="none" stroke-linecap="round">
    <path d="M690 100 q6 -6 12 0 q6 -6 12 0"/><path d="M722 86 q5 -5 10 0 q5 -5 10 0"/>
