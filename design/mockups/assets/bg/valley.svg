<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" preserveAspectRatio="xMidYMid slice">
  <!-- Sunny valley: cartoon sky, smiling sun, clouds, rolling hills, trees, a little house. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4FB8FF"/><stop offset=".55" stop-color="#9FDDFF"/><stop offset="1" stop-color="#D4F2FF"/>
    </linearGradient>
    <g id="cloud">
      <ellipse cx="0" cy="14" rx="62" ry="18" fill="#D6ECFA"/>
      <circle cx="-30" cy="0" r="24" fill="#FFFFFF"/><circle cx="2" cy="-12" r="32" fill="#FFFFFF"/>
      <circle cx="36" cy="2" r="22" fill="#FFFFFF"/><rect x="-54" y="0" width="110" height="20" rx="10" fill="#FFFFFF"/>
    </g>
    <g id="tree">
      <rect x="-7" y="10" width="14" height="40" rx="5" fill="#8B5A2B"/>
      <circle cx="0" cy="-8" r="34" fill="#2E9E3E"/><circle cx="-14" cy="-18" r="16" fill="#4CC25A"/>
      <circle cx="16" cy="4" r="5" fill="#FF5A5F"/><circle cx="-10" cy="10" r="5" fill="#FF5A5F"/><circle cx="6" cy="-26" r="5" fill="#FF5A5F"/>
    </g>
    <g id="flower">
