  <g fill="#FF7FB0"><use href="#flower" transform="translate(120 515)"/><use href="#flower" transform="translate(700 520)"/><use href="#flower" transform="translate(930 515)"/></g>
  <g fill="#FFFFFF"><use href="#flower" transform="translate(300 525)"/><use href="#flower" transform="translate(520 512)"/></g>
