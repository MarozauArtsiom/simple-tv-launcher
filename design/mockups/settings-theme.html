<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>Theme picker</title>
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="themes.css">
  <link rel="stylesheet" href="settings.css">
  <script src="panel.js"></script>
  <style>
    /* Live preview: the focused theme is applied to the panel and to the home screen behind it. */
    :root { --dim: .15; }
    .family .section { margin: 8px 0 6px; }
    .themes { display: grid; grid-template-columns: repeat(3, 148px); gap: 12px; }
    .theme { position: relative; margin: 0; width: 148px; height: 83px; border-radius: 10px; }
    .theme img { width: 100%; height: 100%; border-radius: 10px; display: block; }
    .theme figcaption {
      position: absolute; left: 6px; bottom: 6px; padding: 0 8px; border-radius: 8px;
      background: rgba(10, 12, 16, .72); color: #FFFFFF; white-space: nowrap;
    }
    .theme .badge {
      position: absolute; top: -6px; right: -6px; width: 24px; height: 24px; border-radius: 50%;
      display: grid; place-items: center; background: var(--signal); color: #0B0D12;
    }
    .theme .badge svg { width: 16px; height: 16px; }
    .theme.focused { box-shadow: 0 0 0 3px var(--item-focus-bg); transform: scale(1.06); z-index: 1; }
    .bottom { margin-top: 12px; }
  </style>
</head>
<body>
  <script src="icons.js"></script>
  <iframe class="behind" title="home"></iframe>
  <div class="dim"></div>

  <aside class="sheet wide">
    <h1>Тема</h1>
    <div id="families"></div>
    <div class="item bottom"><svg><use href="#schedule"/></svg><span class="title title-medium">Менять по времени суток</span><span class="value body-medium">Выкл</span><svg class="chevron"><use href="#chevron"/></svg></div>
  </aside>

  <script>
    const FAMILIES = [
      ['Тёмные', ['midnight', 'graphite', 'aurora']],
      ['Светлые', ['paper', 'sky', 'sage']],
      ['Мультяшные', ['valley', 'ocean', 'space']],
    ];
    const current = 'midnight'; // the saved theme; the focused one is only previewed until OK
    document.getElementById('families').innerHTML = FAMILIES.map(([label, ids]) => `
      <div class="family">
        <div class="section label-large">${label}</div>
        <div class="themes">${ids.map((id) => `
          <figure class="theme${id === panelTheme ? ' focused' : ''}">
            <img src="themes/${id}.png" alt="">
            <figcaption class="label-large">${THEME_NAMES[id]}</figcaption>
            ${id === current ? '<span class="badge"><svg><use href="#check"/></svg></span>' : ''}
          </figure>`).join('')}
        </div>
      </div>`).join('');
  </script>
</body>
</html>
