<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>Theme schedule</title>
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="themes.css">
  <link rel="stylesheet" href="settings.css">
  <script src="panel.js"></script>
  <style></style>
</head>
<body>
  <script src="icons.js"></script>
  <iframe class="behind" data-src="home.html?nofocus" title="home"></iframe>

  <div class="dim"></div>
  <aside class="sheet">
    <h1>Тема по времени суток</h1>
    <div class="item focused"><svg><use href="#schedule"/></svg><span class="title title-medium">Менять автоматически</span><span class="switch on"></span></div>
    <div class="section label-large">Днём</div>
    <div class="item"><svg><use href="#palette"/></svg><span class="title title-medium">Бумага</span><span class="value body-medium">до заката</span><svg class=chevron><use href="#chevron"/></svg></div>
    <div class="section label-large">Вечером и ночью</div>
    <div class="item"><svg><use href="#palette"/></svg><span class="title title-medium">Космос</span><span class="value body-medium">после заката</span><svg class=chevron><use href="#chevron"/></svg></div>
    <div class="note" style="margin-top: 16px"><svg><use href="#sunrise"/></svg><div class="body-medium">Закат 18:12 · восход 07:05. Время берётся из погоды; без неё меняется в 07:00 и 20:00.</div></div>
  </aside>
  <script></script>
</body>
</html>
